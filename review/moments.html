<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moment Trainer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root { --bg:#0d1116; --panel:#161c24; --ink:#e6ebf1; --muted:#93a0b1; --line:#2a323e; --accent:#f0a54a; --good:#5fbf6a; --bad:#e0605a;
  --c0:#6aa9d6; --c1:#c58be0; --c2:#5fc4a8; --c3:#e8b04f;
  --display:"Archivo","Segoe UI",system-ui,sans-serif; --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace; color-scheme: dark }
* { box-sizing: border-box } [hidden] { display: none !important }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body) }
.wrap { max-width: 1280px; margin: 0 auto; padding: 18px 16px 40px; display: grid; gap: 14px }
header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap }
h1 { font: 900 26px var(--display); margin: 0 } h1 span { color: var(--accent) }
.sub { color: var(--muted); font-size: 13.5px }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px }
.ctx { font: 800 20px var(--display); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap }
.ctx small { font: 13px var(--mono); color: var(--muted) }
video { width: 100%; border-radius: 8px; background: #000; display: block; max-height: 62vh }
.lane { position: relative; height: 34px; background: #ffffff08; border-radius: 6px; cursor: pointer; overflow: hidden }
.lane .head { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink) }
.lane .game { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--accent); box-shadow: 0 0 10px var(--accent) }
.lane .game::after { content: "game"; position: absolute; left: 6px; top: 2px; font: 11px var(--mono); color: var(--accent) }
.lane .chg { position: absolute; bottom: 0; height: 55%; width: 3px; background: var(--c) }
.lane .chg::after { content: "music"; position: absolute; left: 6px; bottom: 1px; font: 11px var(--mono); color: var(--c) }
.opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px } @media (max-width: 800px) { .opts { grid-template-columns: 1fr 1fr } }
.op { border: 2px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 8px; cursor: pointer }
.op.on { border-color: var(--c); box-shadow: 0 0 18px color-mix(in srgb, var(--c) 40%, transparent) }
.op.best { border-color: var(--good); background: #5fbf6a12 } .op.worst { border-color: var(--bad); background: #e0605a12 }
.op h2 { margin: 0; font: 900 22px var(--display); color: var(--c) } .op h2 kbd { font: 12px var(--mono); color: var(--muted) }
.op .bb { display: grid; grid-template-columns: 1fr 1fr; gap: 6px }
.op .reveal { font: 12px/1.4 var(--mono); color: var(--muted) }
button { font: inherit; padding: 8px; border-radius: 9px; border: 1px solid var(--line); background: #222a35; color: var(--ink); cursor: pointer }
button:hover { border-color: var(--accent) }
.bbest.on { background: #5fbf6a33; border-color: var(--good) } .bworst.on { background: #e0605a33; border-color: var(--bad) }
.bottom { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 8px } @media (max-width: 700px) { .bottom { grid-template-columns: 1fr } }
#allbad.on { background: #e0605a33; border-color: var(--bad) }
#next { font-weight: 700; background: #f0a54a22; border-color: var(--accent) } #next:disabled { opacity: .4 }
.ctl { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted) }
.prog { height: 6px; background: #ffffff10; border-radius: 3px; overflow: hidden } .prog div { height: 100%; background: var(--accent); width: 0 }
textarea { width: 100%; background: #0f141a; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: 13px var(--body); min-height: 38px }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Moment <span>Trainer</span></h1>
    <div class="sub">Same gameplay, different music. Pick the version that fits the moment best (and worst): whether it changes, when, and how. Keys: 1–4 switch music · Q/W best/worst on the playing one · space pause · R restart · Enter next.</div></header>
  <div class="prog"><div id="prog"></div></div>
  <div class="card" id="card">
    <div class="ctx"><span id="ctx">loading…</span><small id="meta"></small></div>
    <video id="v" playsinline loop></video>
    <div class="lane" id="lane"><div class="head" id="head"></div></div>
    <div class="ctl">
      <label>game sound <input type="range" id="gv" min="0" max="1" step="0.05" value="0.35"></label>
      <label>music <input type="range" id="mv" min="0" max="1" step="0.05" value="0.9"></label>
      <span id="tm" style="font-family:var(--mono)"></span>
    </div>
    <div class="opts" id="opts"></div>
    <textarea id="note" placeholder="optional note (what the moment needed)"></textarea>
    <div class="bottom">
      <button id="allbad">All bad</button>
      <button id="restart">↺ Restart clip</button>
      <button id="next" disabled>Save &amp; next ⏎</button>
    </div>
  </div>
  <div class="sub" id="done" hidden>Set finished. Tell Claude “moments done”.</div>
</div>
<script>
const COLORS = ["--c0", "--c1", "--c2", "--c3"], L = "ABCD";
let set = null, idx = 0, cur = 0, best = null, worst = null, allbad = false, revealed = false, answers = [];
const v = document.getElementById("v");
let auds = [];

async function load() {
  set = await (await fetch("moments/set.json?" + Date.now())).json();
  answers = await (await fetch("/moments_answers")).json();
  const done = new Set(answers.map(a => a.id));
  idx = set.items.findIndex(it => !done.has(it.id));
  if (idx < 0) { finish(); return; }
  show();
}
function finish() { document.getElementById("card").hidden = true; document.getElementById("done").hidden = false; document.getElementById("prog").style.width = "100%"; }

function show() {
  const it = set.items[idx];
  best = worst = null; allbad = false; revealed = false;
  document.getElementById("note").value = "";
  document.getElementById("allbad").classList.remove("on");
  document.getElementById("prog").style.width = (100 * idx / set.items.length) + "%";
  document.getElementById("ctx").textContent = it.context;
  document.getElementById("meta").textContent = `${idx + 1}/${set.items.length} · ${it.mission} · game changes at ${it.at.toFixed(0)}s`;
  auds.forEach(a => { a.pause(); a.src = ""; });
  auds = it.options.map(o => { const a = new Audio("moments/" + o.file); a.preload = "auto"; return a; });
  v.src = "moments/" + it.video; v.volume = +document.getElementById("gv").value;
  const box = document.getElementById("opts"); box.innerHTML = "";
  it.options.forEach((o, k) => {
    const d = document.createElement("div"); d.className = "op"; d.style.setProperty("--c", `var(${COLORS[k]})`);
    d.innerHTML = `<h2>${L[k]} <kbd>${k + 1}</kbd></h2><div class="bb"><button class="bbest">👍 best</button><button class="bworst">👎 worst</button></div><div class="reveal" hidden></div>`;
    d.onclick = e => { if (e.target.tagName !== "BUTTON") pick(k); };
    d.querySelector(".bbest").onclick = () => mark("best", k);
    d.querySelector(".bworst").onclick = () => mark("worst", k);
    box.appendChild(d);
  });
  pick(0); lane(); upd();
  v.currentTime = 0; v.play().catch(() => {});
}
function lane() {
  const it = set.items[idx], el = document.getElementById("lane"), D = 22;
  el.querySelectorAll(".game,.chg").forEach(x => x.remove());
  const g = document.createElement("div"); g.className = "game"; g.style.left = (100 * it.at / D) + "%"; el.appendChild(g);
  if (revealed || true) (it.options[cur].changes || []).forEach(c => {
    const m = document.createElement("div"); m.className = "chg"; m.style.left = (100 * c / D) + "%";
    m.style.setProperty("--c", `var(${COLORS[cur]})`); el.appendChild(m);
  });
}
function pick(k) {
  cur = k;
  auds.forEach((a, i) => { if (i !== k) a.pause(); });
  const a = auds[k]; a.volume = +document.getElementById("mv").value;
  a.currentTime = v.currentTime || 0;
  if (!v.paused) a.play().catch(() => {});
  document.querySelectorAll(".op").forEach((d, i) => d.classList.toggle("on", i === k));
  lane();
}
function mark(what, k) {
  if (what === "best") { best = best === k ? null : k; if (worst === k) worst = null; }
  else { worst = worst === k ? null : k; if (best === k) best = null; }
  allbad = false; document.getElementById("allbad").classList.remove("on");
  upd();
}
function upd() {
  document.querySelectorAll(".op").forEach((d, i) => {
    d.classList.toggle("best", best === i); d.classList.toggle("worst", worst === i);
    d.querySelector(".bbest").classList.toggle("on", best === i); d.querySelector(".bworst").classList.toggle("on", worst === i);
  });
  document.getElementById("next").disabled = !(allbad || best !== null);
}
async function save() {
  const it = set.items[idx];
  const kinds = it.options.map(o => o.kind);
  answers.push({ id: it.id, set: set.id, best: best === null ? null : kinds[best], worst: worst === null ? null : kinds[worst],
                 all: allbad ? "bad" : null, note: document.getElementById("note").value.trim() || null, item: it, at: Date.now() / 1000 });
  await fetch("/moments_answers", { method: "POST", body: JSON.stringify(answers) });
  // show what each one was, briefly
  document.querySelectorAll(".op").forEach((d, i) => { const r = d.querySelector(".reveal"); r.hidden = false; r.textContent = it.options[i].desc; });
  revealed = true;
  document.getElementById("next").disabled = true;
  setTimeout(() => { idx++; if (idx >= set.items.length) { auds.forEach(a => a.pause()); v.pause(); finish(); } else show(); }, 2600);
}
v.addEventListener("play", () => { const a = auds[cur]; if (a) { a.currentTime = v.currentTime; a.play().catch(() => {}); } });
v.addEventListener("pause", () => auds.forEach(a => a.pause()));
v.addEventListener("seeked", () => { const a = auds[cur]; if (a) a.currentTime = v.currentTime; });
setInterval(() => {
  const a = auds[cur]; if (!a) return;
  if (!v.paused && Math.abs(a.currentTime - v.currentTime) > 0.08) a.currentTime = v.currentTime;
  if (!v.paused && a.paused) a.play().catch(() => {});
  document.getElementById("head").style.left = (100 * v.currentTime / 22) + "%";
  document.getElementById("tm").textContent = v.currentTime.toFixed(1) + "s";
}, 100);
document.getElementById("lane").onclick = e => { const r = e.currentTarget.getBoundingClientRect(); v.currentTime = 22 * (e.clientX - r.left) / r.width; };
document.getElementById("gv").oninput = e => v.volume = +e.target.value;
document.getElementById("mv").oninput = e => auds.forEach(a => a.volume = +e.target.value);
document.getElementById("restart").onclick = () => { v.currentTime = 0; v.play(); };
document.getElementById("allbad").onclick = e => { allbad = !allbad; best = worst = null; e.target.classList.toggle("on", allbad); upd(); };
document.getElementById("next").onclick = save;
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") return;
  if (e.key >= "1" && e.key <= "4" && +e.key <= auds.length) pick(+e.key - 1);
  else if (e.key === "q") mark("best", cur);
  else if (e.key === "w") mark("worst", cur);
  else if (e.key === " ") { e.preventDefault(); v.paused ? v.play() : v.pause(); }
  else if (e.key === "r") { v.currentTime = 0; v.play(); }
  else if (e.key === "Enter" && !document.getElementById("next").disabled) save();
});
load();
</script>
</body>
</html>
